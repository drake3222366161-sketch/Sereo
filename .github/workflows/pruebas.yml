name: Pruebas SEREO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Revisar sintaxis de los PHP del backend
        run: find backend -name "*.php" -not -path "*/vendor/*" -print0 | xargs -0 -n1 php -l

  pruebas-unitarias:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Correr PHPUnit
        run: vendor/bin/phpunit
        working-directory: backend        